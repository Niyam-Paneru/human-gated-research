<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="t d">
<title id="t">Human gated research architecture</title><desc id="d">Evidence becomes a proposal; human approval binds to the exact proposal digest before one irreversible action is authorized.</desc>
<rect width="1200" height="520" fill="#f5f5f1"/>
<text x="56" y="62" fill="#71716a" font-family="Arial,sans-serif" font-size="13" letter-spacing="3">HUMAN-GATED RESEARCH</text>
<text x="56" y="105" fill="#171714" font-family="Georgia,serif" font-size="34">Research can roam. Authority stays narrow.</text>

<rect x="58" y="170" width="200" height="100" rx="14" fill="#fff" stroke="#171714" stroke-width="2"/>
<text x="82" y="202" fill="#71716a" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">EVIDENCE</text>
<text x="82" y="234" fill="#171714" font-family="Arial,sans-serif" font-size="20" font-weight="700">sources + claims</text>

<rect x="330" y="145" width="235" height="150" rx="16" fill="#fff" stroke="#171714" stroke-width="2"/>
<text x="355" y="178" fill="#71716a" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">PROPOSAL</text>
<text x="355" y="210" fill="#171714" font-family="Georgia,serif" font-size="24">Exact content.</text>
<text x="355" y="247" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">target</text>
<text x="420" y="247" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">rationale</text>
<text x="495" y="247" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">evidence</text>

<rect x="640" y="145" width="235" height="150" rx="16" fill="#fff" stroke="#171714" stroke-width="2"/>
<text x="665" y="178" fill="#71716a" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">HUMAN AUTHORITY</text>
<text x="665" y="210" fill="#171714" font-family="Georgia,serif" font-size="24">Approve this digest.</text>
<text x="665" y="247" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">expires</text>
<text x="735" y="247" fill="#4e4e48" font-family="Arial,sans-serif" font-size="14">one use</text>

<rect x="950" y="170" width="190" height="100" rx="14" fill="#e4edb0" stroke="#596e35" stroke-width="2"/>
<text x="975" y="202" fill="#596e35" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">ACTION</text>
<text x="975" y="234" fill="#171714" font-family="Arial,sans-serif" font-size="20" font-weight="700">authorize once</text>

<g stroke="#171714" stroke-width="2" fill="none"><path d="M258 220 H330"/><path d="M565 220 H640"/><path d="M875 220 H950"/></g>
<g fill="#171714"><path d="M322 214 l10 6 -10 6z"/><path d="M632 214 l10 6 -10 6z"/><path d="M942 214 l10 6 -10 6z"/></g>

<rect x="330" y="360" width="545" height="72" rx="14" fill="#f1d9dc" stroke="#a4243b" stroke-width="2"/>
<text x="355" y="390" fill="#a4243b" font-family="Arial,sans-serif" font-size="12" letter-spacing="2">CHANGED AFTER APPROVAL?</text>
<text x="355" y="418" fill="#171714" font-family="Georgia,serif" font-size="20">Digest mismatch → refuse.</text>
</svg>