<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
<title id="t">Human-gated research workflow</title>
<desc id="d">Evidence becomes claims and a proposal; a human approval bound to the proposal digest is required before action.</desc>
<rect width="1200" height="320" fill="#0b1020"/>
<text x="56" y="52" fill="#f8fafc" font-family="Arial,sans-serif" font-size="28" font-weight="700">Research can be automatic. World-changing actions get a checkpoint.</text>
<path d="M86 173 H1110" stroke="#273449" stroke-width="5" stroke-linecap="round"/>
<g font-family="Arial,sans-serif" text-anchor="middle">
  <g transform="translate(110)"><circle cy="173" r="27" fill="#60a5fa"/><text y="180" font-size="18" font-weight="700">1</text><text y="222" fill="#dbeafe" font-size="14">evidence</text></g>
  <g transform="translate(300)"><circle cy="173" r="27" fill="#38bdf8"/><text y="180" font-size="18" font-weight="700">2</text><text y="222" fill="#dbeafe" font-size="14">rank claims</text></g>
  <g transform="translate(490)"><circle cy="173" r="27" fill="#22d3ee"/><text y="180" font-size="18" font-weight="700">3</text><text y="222" fill="#cffafe" font-size="14">proposal</text></g>
  <g transform="translate(680)"><circle cy="173" r="27" fill="#f59e0b"/><text y="180" font-size="18" font-weight="700">4</text><text y="222" fill="#fef3c7" font-size="14">human review</text></g>
  <g transform="translate(870)"><circle cy="173" r="27" fill="#a78bfa"/><text y="180" font-size="18" font-weight="700">5</text><text y="222" fill="#ede9fe" font-size="14">digest match</text></g>
  <g transform="translate(1060)"><circle cy="173" r="27" fill="#4ade80"/><text y="180" font-size="18" font-weight="700">6</text><text y="222" fill="#dcfce7" font-size="14">authorize once</text></g>
</g>
<text x="870" y="118" fill="#fb7185" font-family="Arial,sans-serif" font-size="13" text-anchor="middle">changed proposal → stop</text>
<text x="1140" y="286" fill="#64748b" font-family="Arial,sans-serif" font-size="13" text-anchor="end">Approving “proposal-7” is not the same as approving whatever proposal-7 becomes later.</text>
</svg>