<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" font-family="ui-monospace, 'Cascadia Mono', Consolas, monospace" role="img" aria-label="Sources are gathered, claims are ranked by independent source count, and a proposal is created. A human approval bound to the proposal digest is the only crossing point before an irreversible action. Read-only actions bypass the gate.">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#8a938f"/>
    </marker>
    <marker id="arOk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2e7077"/>
    </marker>
    <marker id="arStop" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#b64730"/>
    </marker>
  </defs>

  <rect width="900" height="400" fill="#f4efe4"/>

  <!-- research phase -->
  <text x="18" y="28" fill="#6d6a61" font-size="10">RESEARCH PHASE — cheap, reversible, no approval</text>
  <g fill="none" stroke="#8a938f" stroke-width="1.6" marker-end="url(#ar)">
    <path d="M120 72 H176"/>
    <path d="M336 72 H392"/>
  </g>

  <rect x="12" y="48" width="108" height="48" rx="4" fill="#11161b"/>
  <text x="66" y="68" fill="#f4efe4" font-size="11" text-anchor="middle">sources</text>
  <text x="66" y="84" fill="#9da6a7" font-size="9" text-anchor="middle">each needs a source</text>

  <rect x="176" y="48" width="160" height="48" rx="4" fill="#11161b"/>
  <text x="256" y="68" fill="#f4efe4" font-size="11" text-anchor="middle">rank</text>
  <text x="256" y="84" fill="#d99b2b" font-size="9" text-anchor="middle">independent groups, not citations</text>

  <rect x="392" y="48" width="180" height="48" rx="4" fill="#11161b"/>
  <text x="482" y="68" fill="#f4efe4" font-size="11" text-anchor="middle">proposal</text>
  <text x="482" y="84" fill="#9da6a7" font-size="9" text-anchor="middle">payload_digest</text>

  <!-- the crossing -->
  <rect x="600" y="40" width="288" height="150" rx="4" fill="#fbf9f2" stroke="#d99b2b" stroke-width="1.8"/>
  <text x="744" y="62" fill="#20211d" font-size="11" text-anchor="middle" font-weight="bold">THE ONLY CROSSING POINT</text>

  <rect x="626" y="76" width="236" height="40" rx="4" fill="#11161b"/>
  <text x="744" y="92" fill="#f4efe4" font-size="10" text-anchor="middle">human approval</text>
  <text x="744" y="107" fill="#d99b2b" font-size="9" text-anchor="middle">binds to digest, not to id · has a TTL</text>

  <rect x="626" y="128" width="236" height="40" rx="4" fill="#2e7077"/>
  <text x="744" y="144" fill="#f4efe4" font-size="10" text-anchor="middle">irreversible action</text>
  <text x="744" y="159" fill="#dff0f0" font-size="9" text-anchor="middle">submit · contact · spend</text>

  <g fill="none" stroke="#8a938f" stroke-width="1.6" marker-end="url(#ar)">
    <path d="M572 72 H592"/>
    <path d="M744 116 V128"/>
  </g>

  <!-- read-only bypass -->
  <g fill="none" stroke="#8a938f" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#arOk)">
    <path d="M256 96 V230 H600"/>
  </g>
  <text x="404" y="246" fill="#6d6a61" font-size="9">read_only skips the gate — governance cost lands only where the world changes</text>

  <!-- refusals -->
  <g fill="none" stroke="#b64730" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arStop)">
    <path d="M700 76 V230"/>
    <path d="M788 76 V230"/>
    <path d="M876 76 V230"/>
  </g>
  <text x="700" y="248" fill="#b64730" font-size="9">no_approval</text>
  <text x="788" y="248" fill="#b64730" font-size="9">proposal_changed</text>
  <text x="876" y="248" fill="#b64730" font-size="9">already_acted</text>

  <!-- audit -->
  <rect x="12" y="278" width="876" height="48" rx="4" fill="#11161b"/>
  <text x="30" y="299" fill="#f4efe4" font-size="11">audit: proposed · approved · refused · expired · superseded · already_acted</text>
  <text x="30" y="316" fill="#9da6a7" font-size="9">same id, different target → denied. the id matched; the digest did not.</text>

  <text x="18" y="360" fill="#20211d" font-size="12">An approval attached to an identifier approves a name, not a plan.</text>
  <text x="18" y="380" fill="#6d6a61" font-size="9">human-gated-research · sanitised extract · illustrative endpoints</text>
</svg>
