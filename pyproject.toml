[project]
name = "human-gated-research"
version = "1.0.0"
description = "Evidence-ranked research proposals where every irreversible action requires a digest-matched human approval."
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["ai-agents", "human-in-the-loop", "evidence", "audit", "least-privilege"]

[project.scripts]
demo = "research_gate.demo:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
