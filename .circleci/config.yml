version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.12
    steps:
      - checkout
      - run:
          name: Install test dependency
          command: pip install pytest
      - run:
          name: Compile public source
          command: python -m compileall -q src
      - run:
          name: Run behavior tests
          command: python -m pytest
      - run:
          name: Run walkthrough
          command: PYTHONPATH=src python -m research_gate.demo
      - run:
          name: Verify public proof structure
          command: |
            test -s docs/workflow.svg
            test -s docs/invariants.md
            test -s docs/failure-modes.md
            test -s SECURITY.md
            test -s PROVENANCE.md

workflows:
  build-and-test:
    jobs:
      - test
